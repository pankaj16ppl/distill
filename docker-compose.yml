# docker-compose.yml  (lives in the PROJECT ROOT)
# Instead of typing long "docker build" / "docker run" commands
# for each piece separately, Compose lets you describe both
# containers in one file and start everything with one command:
#     docker compose up

services:

  #Backend: Node/Express API
  backend:
    build:
      context: ./backend        # look for a Dockerfile inside backend/
    ports:
      - "5000:5000"              # host_port:container_port
      # Your browser will reach the API at http://localhost:5000 — same as
      # when you run it without Docker, so nothing in the frontend JS changes.
    env_file:
      - ./backend/.env           # loads DATABASE_URL, JWT_SECRET, etc.
    restart: unless-stopped

  # ---- Frontend: static HTML/CSS/JS via nginx 
  frontend:
    build:
      context: .                 # project root
      dockerfile: Dockerfile.frontend
    ports:
      - "5500:80"
      # Open http://localhost:5500 in your browser — matches the port
      # you're already used to from Live Server.
    depends_on:
      - backend
    restart: unless-stopped
