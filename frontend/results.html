<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="refresh" content="0; url=home.html" />

<title>Redirecting… · Distill</title>

<script>
  // Redirect everything to New Chat while preserving the search query.
var params = new URLSearchParams(window.location.search);
var q = params.get("q");

window.location.replace(
  q
    ? ("home.html?q=" + encodeURIComponent(q))
    : "home.html"
);
</script>

</head>
<body></body>
</html>
