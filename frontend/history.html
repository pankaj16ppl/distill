
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>History · Distill</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-cream text-ink antialiased">

  <div class="flex min-h-screen">

    <div id="sidebar-root"></div>

    <div class="flex-1 min-w-0 flex flex-col">

      <header class="h-20 shrink-0 flex items-center px-6 lg:px-10 border-b border-line bg-cream/80 backdrop-blur sticky top-0 z-20">
        <div id="topnav-root" class="w-full"></div>
      </header>

      <main class="flex-1 px-6 lg:px-10 py-10 page-enter">

        <div class="max-w-3xl mx-auto">

          <div class="flex items-center justify-between mb-8">

            <div class="flex items-center gap-3">

              <span class="w-9 h-9 rounded-xl bg-green-light flex items-center justify-center">
                <i data-lucide="history" class="w-5 h-5 text-green-dark"></i>
              </span>

              <h1 class="text-2xl font-bold">Search history</h1>

            </div>

            <button
              id="clearHistoryBtn"
              class="btn-scale text-sm font-semibold text-red-500 border border-red-200 px-4 py-2 rounded-btn hover:bg-red-50 flex items-center gap-1.5"
            >
              <i data-lucide="trash-2" class="w-4 h-4"></i>
              Clear all
            </button>

          </div>

          <div class="relative mb-6 max-w-sm">

            <i
              data-lucide="search"
              class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2"
            ></i>

            <input
              id="historySearchInput"
              type="text"
              placeholder="Search your history..."
              class="w-full pl-10 pr-4 py-2.5 rounded-btn border border-line bg-white text-sm outline-none search-shell"
            />

          </div>

          <div
            id="historyList"
            class="bg-white rounded-card border border-line divide-y divide-line overflow-hidden"
          ></div>

          <div
            id="historyEmpty"
            class="hidden text-center py-16 text-muted"
          >

            <i
              data-lucide="inbox"
              class="w-8 h-8 mx-auto text-gray-300"
            ></i>

            <p class="mt-3">
              No searches yet — head back to Home and try one.
            </p>

          </div>

        </div>

      </main>

      <div id="footer-root"></div>

    </div>

  </div>

  <script src="js/auth.js"></script>
  <script src="js/history.js"></script>
  <script src="js/components.js"></script>

  <script>

    requireAuth();
    renderShell("history");

    // API_BASE is defined centrally in js/auth.js
    let historyData = [];


    // Fetch history from backend
    function loadHistory() {
  historyData = getHistory();

  draw();
}
    // Draw history
    function draw(filter = "") {
  const items = historyData.filter((h) => {
    return (h.query || "")
      .toLowerCase()
      .includes(filter.toLowerCase());
  });

  const list = document.getElementById("historyList");
  const empty = document.getElementById("historyEmpty");

  if (!items.length) {
    list.classList.add("hidden");
    empty.classList.remove("hidden");
    return;
  }

  list.classList.remove("hidden");
  empty.classList.add("hidden");

  list.innerHTML = items.map((h) => `
  <button
    type="button"
    class="w-full block px-5 py-5 hover:bg-green-light/30 text-left"
    data-history-id="${escapeHtml(h.id)}"
  >
    <div class="flex items-start gap-3">

      <span class="w-8 h-8 rounded-lg bg-cream flex items-center justify-center shrink-0">
        <i
          data-lucide="clock"
          class="w-4 h-4 text-gray-400"
        ></i>
      </span>

      <div class="flex-1 min-w-0">

        <div class="flex items-center justify-between gap-3">

          <p class="text-sm font-semibold text-ink truncate">
            ${escapeHtml(h.query || "Untitled search")}
          </p>

          <span class="text-xs text-muted shrink-0">
            ${relativeTime(h.time)}
          </span>

        </div>

        <p class="text-xs text-muted mt-1">
          Search history
        </p>

      </div>

    </div>
  </button>
`).join("");

  if (window.lucide) {
    lucide.createIcons();
  }
}


    // Escape HTML before displaying database data
    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    // Format date
    function formatDate(value) {

      if (!value) return "";

      return new Date(value).toLocaleString();

    }


    // Search history
    document
      .getElementById("historySearchInput")
      .addEventListener("input", (e) => {

        draw(e.target.value);

      });


    // Clear all history
    document
      .getElementById("clearHistoryBtn")
      .addEventListener("click", async () => {

        if (!historyData.length) {
          return;
        }

        const confirmed = confirm(
          "Are you sure you want to delete your history?"
        );

        if (!confirmed) {
          return;
        }


        const token =
          localStorage.getItem("distill_token");

        try {

          const responses = await Promise.all(

            historyData.map((item) =>

              fetch(
                `${API_BASE}/history/${item.id}`,
                {
                  method: "DELETE",
                  headers: {
                    "Authorization": `Bearer ${token}`
                  }
                }
              )

            )

          );


          const failed = responses.some(
            (response) => !response.ok
          );

          if (failed) {
            throw new Error(
              "One or more history records could not be deleted."
            );
          }


          historyData = [];

          draw();

        } catch (error) {

          console.error(
            "Clear history error:",
            error
          );

          alert(
            "Failed to clear history."
          );

        }

      });


    // Load backend history when page opens
    loadHistory();

  </script>

</body>
</html>
```
