<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Recommendations · Distill</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/recommendation-card.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-cream text-ink antialiased">

  <div class="flex min-h-screen">
    <div id="sidebar-root"></div>

    <div class="flex-1 min-w-0 flex flex-col">
      <header class="h-20 shrink-0 flex items-center px-6 lg:px-10 border-b border-line bg-cream/80 backdrop-blur sticky top-0 z-20">
        <div id="topnav-root" class="w-full"></div>
      </header>

      <main class="flex-1 px-6 py-10 page-enter">
        <div class="max-w-6xl mx-auto">

          <!-- Search & Multi-Query Controls -->
          <div class="flex items-center gap-3 mb-6 max-w-4xl mx-auto">
            <div class="flex-1 search-shell flex items-center gap-3 bg-white rounded-search shadow-search border border-line h-[56px] px-4">
              <i data-lucide="search" class="w-5 h-5 text-gray-400 shrink-0"></i>
              <input id="homeSearchInput" type="text" autocomplete="off" placeholder="Search AI tools for any task..."
                class="flex-1 min-w-0 bg-transparent outline-none text-sm placeholder:text-gray-400" />
              <button id="voiceSearchBtn"
                class="btn-scale shrink-0 w-10 h-10 rounded-full flex items-center justify-center text-gray-500 hover:bg-green-light hover:text-green-dark transition"
                title="Search by voice">
                <i data-lucide="mic" class="w-5 h-5"></i>
              </button>
              <button id="homeSearchBtn" class="btn-scale shrink-0 px-5 py-2 rounded-btn bg-green text-white text-sm font-semibold hover:bg-green-dark">Search</button>
            </div>
            <button id="addQueryBtn" class="btn-scale shrink-0 w-11 h-11 rounded-full bg-green-light text-green-dark flex items-center justify-center hover:bg-green hover:text-white transition-colors" title="Add additional keywords">
              <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
          </div>

          <!-- Active Tags -->
          <div id="activeTags" class="flex flex-wrap gap-2 mb-6 max-w-4xl mx-auto"></div>

          <!-- Results Blocks -->
          <div id="resultsBlocks">
            <!-- Empty State -->
            <div id="emptyState" class="text-center py-20">
              <i data-lucide="search-x" class="w-10 h-10 text-gray-300 mx-auto"></i>
              <p class="mt-4 text-muted">Search for a task above to see your matches.</p>
            </div>
          </div>

          <!-- Up Arrow Scroll -->
          <button id="upArrowBtn" class="fixed bottom-6 right-6 w-12 h-12 rounded-full bg-white shadow-card border border-line flex items-center justify-center opacity-0 pointer-events-none transition-opacity hover:shadow-lg">
            <i data-lucide="arrow-up" class="w-5 h-5 text-green-dark"></i>
          </button>
        </div>
      </main>

      <div id="footer-root"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
<script src="js/history.js"></script>
<script src="js/components.js"></script>
<script src="js/rating.js"></script>
<script src="js/recommendation-card.js"></script>
<script src="js/results.js"></script>
  <script>
    requireAuth();
    renderShell("recommendations");

    // State
    let activeQueries = [];

    // DOM refs
    const searchInput = document.getElementById('homeSearchInput');
    const searchBtn = document.getElementById('homeSearchBtn');
    const voiceSearchBtn = document.getElementById('voiceSearchBtn');
    const addBtn = document.getElementById('addQueryBtn');
    const activeTags = document.getElementById('activeTags');
    const resultsBlocks = document.getElementById('resultsBlocks');
    const emptyState = document.getElementById('emptyState');
    const upArrowBtn = document.getElementById('upArrowBtn');

    // Voice Search
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();

      recognition.lang = "en-IN";
      recognition.continuous = false;
      recognition.interimResults = false;

      voiceSearchBtn.addEventListener("click", () => {
        recognition.start();

        voiceSearchBtn.classList.add("bg-red-100", "text-red-500");
        voiceSearchBtn.innerHTML =
          '<i data-lucide="mic-off" class="w-5 h-5"></i>';

        if (window.lucide) lucide.createIcons();
      });

      recognition.onresult = (event) => {
        const voiceText = event.results[0][0].transcript;
        searchInput.value = voiceText;
        searchBtn.click();
      };

      recognition.onend = () => {
        voiceSearchBtn.classList.remove("bg-red-100", "text-red-500");
        voiceSearchBtn.innerHTML =
          '<i data-lucide="mic" class="w-5 h-5"></i>';

        if (window.lucide) lucide.createIcons();
      };

      recognition.onerror = (event) => {
        console.log("Voice recognition error:", event.error);

        voiceSearchBtn.classList.remove("bg-red-100", "text-red-500");
        voiceSearchBtn.innerHTML =
          '<i data-lucide="mic" class="w-5 h-5"></i>';

        if (window.lucide) lucide.createIcons();
      };
    } else {
      voiceSearchBtn.addEventListener("click", () => {
        alert("Voice search is not supported in this browser. Please use Chrome.");
      });
    }

    // Initial load from URL
    const urlParams = new URLSearchParams(window.location.search);
    const initialQuery = urlParams.get('q');
    if (initialQuery) {
      activeQueries = [initialQuery];
      searchInput.value = initialQuery;
      addHistory(initialQuery);
    }

    // Render tags
    function renderTags() {
      activeTags.innerHTML = activeQueries.map((q, i) => `
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-green-light text-green-dark text-xs font-semibold">
          ${q}
          <button class="remove-tag hover:text-red-500" data-index="${i}"><i data-lucide="x" class="w-3 h-3"></i></button>
        </span>
      `).join('');
      if (window.lucide) lucide.createIcons();

      document.querySelectorAll('.remove-tag').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.index);
          activeQueries.splice(idx, 1);
          renderTags();
          if (activeQueries.length === 0) {
            resultsBlocks.innerHTML = '';
            emptyState.classList.remove('hidden');
          } else {
            performSearch(false);
          }
        });
      });
    }

    // Backend base — change if you deploy the API elsewhere.
    const API_BASE = "http://localhost:5000/api";

    // recommendation-card.js expects: id, name, category, description,
    // pricing (free|hybrid|paid), pros[], cons[], rating, url, credits.
    // The ai_tools table gives us: id, tool_name, category, description,
    // pricing, official_website, best_use_cases[], target_users[].
    // This maps one shape to the other so nothing in recommendation-card.js
    // has to change. `pros`/`cons` aren't real DB columns yet, so we fall
    // back to best_use_cases for pros and leave cons empty — swap these two
    // lines out once/if you add real pros/cons columns.
    function mapDbToolToCard(row, query) {
      const pricingRaw = (row.pricing || "hybrid").toLowerCase();
      const pricing = ["free", "hybrid", "paid"].includes(pricingRaw) ? pricingRaw : "hybrid";
      return {
        id: row.id, // real numeric ai_tools.id — this is what makes rating.js work
        name: row.tool_name,
        category: row.category || "AI Tool",
        pricing,
        description: `Great for "${query}". ${row.description || ""}`,
        pros: Array.isArray(row.best_use_cases) ? row.best_use_cases.slice(0, 2) : [],
        cons: [],
        rating: 0, // placeholder — recommendation-card.js overwrites this live via /api/ratings
        url: row.official_website || "#",
        credits: row.pricing === "free" ? "Free tier available" : undefined,
      };
    }

    async function fetchToolsFromDb(query) {
      const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`);
      const json = await res.json();
      if (!json.success) throw new Error(json.message || "Search failed");
      return json.data; // array of ai_tools rows
    }

    // Main Search Function — now backed by Neon via GET /api/search.
    async function performSearch(append = false) {
      if (activeQueries.length === 0) {
        resultsBlocks.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      const fullQuery = activeQueries.join(" ");

      const block = document.createElement('div');
      block.className = 'results-block mt-8 page-enter';
      if (append) {
        resultsBlocks.appendChild(block);
      } else {
        resultsBlocks.innerHTML = '';
        resultsBlocks.appendChild(block);
      }

      // Skeleton while the DB responds.
      renderRecommendationSkeleton(block, 7);

      let rows;
      try {
        rows = await fetchToolsFromDb(fullQuery);
      } catch (err) {
        console.error("Search API error:", err);
        block.innerHTML = `<p class="text-center text-muted py-16">Couldn't reach the server. Is the backend running on port 5000?</p>`;
        return;
      }

      if (!rows.length) {
        block.innerHTML = `<p class="text-center text-muted py-16">No AI tools matched "${fullQuery}" yet.</p>`;
        return;
      }

      // rows[0] becomes the highlighted main card, rows[1..6] the six
      // alternatives — renderRecommendationCards() handles that split.
      const toolsForCards = rows.slice(0, 7).map((row) => mapDbToolToCard(row, fullQuery));
      renderRecommendationCards(block, toolsForCards);

      if (append) {
        block.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      // Show up arrow if more than 1 block
      upArrowBtn.style.opacity = resultsBlocks.children.length > 1 ? '1' : '0';
      upArrowBtn.style.pointerEvents = resultsBlocks.children.length > 1 ? 'auto' : 'none';
    }

    // Event Listeners
    searchBtn.addEventListener('click', () => {
      const val = searchInput.value.trim();
      if (!val) return;
      activeQueries = [val];
      history.replaceState(null, "", `recommendations.html?q=${encodeURIComponent(val)}`);
      renderTags();
      performSearch(false);
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchBtn.click();
    });

    addBtn.addEventListener('click', () => {
      const val = searchInput.value.trim();
      if (!val) return;
      activeQueries.push(val);
      renderTags();
      searchInput.value = '';
      performSearch(true);
    });

    upArrowBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Initialize
    renderTags();
    if (activeQueries.length > 0) {
      performSearch(false);
    }
  </script>
</body>
</html>
