/* =========================================================
   DATABASE ROW → RECOMMENDATION CARD
   ========================================================= */

function mapDbToolToCard(row, query) {

  console.log(
    "MAPPING ROW:",
    row
  );


  /* -------------------------------------------------------
     Normalize arrays
     ------------------------------------------------------- */

  function normalizeArray(value) {

    if (Array.isArray(value)) {
      return value;
    }

    if (typeof value === "string") {

      try {

        const parsed =
          JSON.parse(value);

        return Array.isArray(parsed)
          ? parsed
          : [];

      } catch {

        return [];
      }
    }

    return [];
  }


  /* -------------------------------------------------------
     Live data
     ------------------------------------------------------- */

  const livePlans =
    normalizeArray(row.live_plans);

  const liveFeatures =
    normalizeArray(row.live_features);


  console.log(
    "LIVE DATA AFTER NORMALIZATION:",
    {
      tool: row.tool_name,
      livePlans,
      liveFeatures
    }
  );


  /* -------------------------------------------------------
     Pricing type
     ------------------------------------------------------- */

  const pricingRaw =
    String(
      row.pricing || "hybrid"
    ).toLowerCase();

  const pricing =
    ["free", "hybrid", "paid"].includes(
      pricingRaw
    )
      ? pricingRaw
      : "hybrid";


  /* -------------------------------------------------------
     Recommendation card object
     ------------------------------------------------------- */

  return {

    /* Preserve API fields */
    ...row,


    /* Basic information */

    id:
      row.id,

    name:
      row.tool_name ||
      row.name ||
      "Unknown Tool",

    category:
      row.category ||
      "AI Tool",

    pricing,


    description:
      row.description || "",


    /* Best use */

    best_use_cases:
      row.best_use_cases || "",


    /* Pros */

    pros:
      Array.isArray(row.pros)
        ? row.pros
        : Array.isArray(row.pros_list)
          ? row.pros_list
          : [],


    /* Cons */

    cons:
      Array.isArray(row.cons)
        ? row.cons
        : Array.isArray(row.cons_list)
          ? row.cons_list
          : [],


    /* Rating */

    rating:
      Number(
        row.rating ??
        row.average_rating ??
        row.avg_rating ??
        0
      ),


    /* Official website */

    url:
      row.official_website ||
      row.url ||
      "#",


    /* Live pricing */

    livePlans,


    /* Live features */

    liveFeatures,


    /* Real logo only */

    logo_url:
      row.logo_url || "",


    /* Source status */

    sourceStatus:
      row.source_status ||
      "unknown",

    sourceLastSuccess:
      row.last_success_at ||
      row.source_last_success ||
      null
  };
}


/* =========================================================
   SEARCH
   ========================================================= */

async function performSearch() {

  const fullQuery =
    searchInput.value.trim();


  if (!fullQuery) {
    return;
  }


  console.log(
    "PERFORM SEARCH:",
    fullQuery
  );


  /* -------------------------------------------------------
     Save history
     ------------------------------------------------------- */

  addHistory(fullQuery);


  /* -------------------------------------------------------
     Loading UI
     ------------------------------------------------------- */

  const loadingBlock =
    document.createElement("div");

  loadingBlock.className =
    "search-loading text-center py-8 text-muted";

  loadingBlock.textContent =
    `Searching "${fullQuery}"...`;

  resultsBlocks.appendChild(
    loadingBlock
  );


  try {

    const response =
      await fetch(
        `${API_BASE}/search?q=${encodeURIComponent(fullQuery)}`
      );


    if (!response.ok) {

      throw new Error(
        `Search failed: ${response.status}`
      );
    }


    const data =
      await response.json();


    console.log(
      "SEARCH RESPONSE:",
      data
    );


    loadingBlock.remove();


    if (!data.success) {

      throw new Error(
        data.message ||
        "Search failed"
      );
    }


    const rows =
      Array.isArray(data.data)
        ? data.data
        : [];


    /* -----------------------------------------------------
       No results
       ----------------------------------------------------- */

    if (rows.length === 0) {

      const noResultsBlock =
        document.createElement("div");

      noResultsBlock.className =
        "results-block mt-8 page-enter";


      noResultsBlock.innerHTML = `
        <div class="text-center py-16">

          <i
            data-lucide="search-x"
            class="w-10 h-10 text-gray-300 mx-auto"
          ></i>

          <p class="mt-4 text-muted">
            No AI tools matched "${fullQuery}".
          </p>

        </div>
      `;


      resultsBlocks.appendChild(
        noResultsBlock
      );


      if (window.lucide) {
        lucide.createIcons();
      }


      /* First search still moves the bar */

      moveSearchBarToBottom();

      return;
    }


    /* -----------------------------------------------------
       Convert rows to cards
       ----------------------------------------------------- */

    const toolsForCards =
      rows
        .slice(0, 7)
        .map(
          row =>
            mapDbToolToCard(
              row,
              fullQuery
            )
        );


    /* -----------------------------------------------------
       Create result block
       ----------------------------------------------------- */

    const block =
      document.createElement("div");

    block.className =
      "results-block mt-8 page-enter";


    /* -----------------------------------------------------
       Result title
       ----------------------------------------------------- */

    const title =
      document.createElement("h2");

    title.className =
      "text-lg font-semibold mb-4";

    title.textContent =
      `Results for "${fullQuery}"`;


    block.appendChild(
      title
    );


    resultsBlocks.appendChild(
      block
    );


    /* -----------------------------------------------------
       Render recommendation cards
       ----------------------------------------------------- */

    renderRecommendationCards(
      block,
      toolsForCards
    );


    /* -----------------------------------------------------
       Move search bar after first successful search
       ----------------------------------------------------- */

    moveSearchBarToBottom();


    /* -----------------------------------------------------
       Icons
       ----------------------------------------------------- */

    if (window.lucide) {
      lucide.createIcons();
    }


    /* -----------------------------------------------------
       Scroll to results
       ----------------------------------------------------- */

    setTimeout(() => {

      block.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }, 100);


  } catch (error) {

    console.error(
      "HOME SEARCH ERROR:",
      error
    );


    loadingBlock.remove();


    const errorBlock =
      document.createElement("div");

    errorBlock.className =
      "results-block mt-8 page-enter";


    errorBlock.innerHTML = `
      <div class="text-center py-16">

        <p class="text-red-500 font-semibold">
          Couldn't reach the server.
        </p>

        <p class="text-sm text-muted mt-2">
          Please make sure the backend is running
          on port 5000.
        </p>

      </div>
    `;


    resultsBlocks.appendChild(
      errorBlock
    );
  }
}


/* =========================================================
   MOVE SEARCH BAR TO BOTTOM
   ========================================================= */

function moveSearchBarToBottom() {

  if (
    topSearchArea &&
    !hasSearched
  ) {

    hasSearched =
      true;

    topSearchArea.classList.remove(
      "mt-8"
    );

    topSearchArea.classList.add(
      "search-bottom"
    );

    console.log(
      "SEARCH BAR MOVED TO BOTTOM"
    );
  }
}


/* =========================================================
   SEARCH TAGS
   ========================================================= */

function renderTags() {

  activeTags.innerHTML =
    activeQueries
      .map(
        (query, index) => `
          <span
            class="
              inline-flex
              items-center
              gap-1.5
              px-3
              py-1
              rounded-full
              bg-green-light
              text-green-dark
              text-xs
              font-semibold
            "
          >

            ${query}

            <button
              class="remove-tag hover:text-red-500"
              data-index="${index}"
              type="button"
            >

              <i
                data-lucide="x"
                class="w-3 h-3"
              ></i>

            </button>

          </span>
        `
      )
      .join("");


  if (window.lucide) {
    lucide.createIcons();
  }


  /* -------------------------------------------------------
     Remove tag
     ------------------------------------------------------- */

  document
    .querySelectorAll(".remove-tag")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const index =
            Number(
              button.dataset.index
            );


          activeQueries.splice(
            index,
            1
          );


          renderTags();
        }
      );

    });
}


/* =========================================================
   SEARCH BUTTON
   ========================================================= */

searchBtn.addEventListener(
  "click",
  async () => {

    console.log(
      "SEARCH BUTTON CLICKED"
    );


    const value =
      searchInput.value.trim();


    if (!value) {
      return;
    }


    activeQueries =
      [value];


    renderTags();


    console.log(
      "ABOUT TO CALL PERFORM SEARCH"
    );


    await performSearch();

  }
);


/* =========================================================
   ENTER KEY
   ========================================================= */

searchInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      event.preventDefault();

      searchBtn.click();

    }

  }
);


/* =========================================================
   PLUS BUTTON
   ========================================================= */

if (addBtn) {

  addBtn.addEventListener(
    "click",
    () => {

      const value =
        searchInput.value.trim();


      if (!value) {
        return;
      }


      activeQueries.push(
        value
      );


      renderTags();


      searchInput.value = "";

    }
  );

}


/* =========================================================
   INITIAL TAG RENDER
   ========================================================= */

renderTags();
</script>
