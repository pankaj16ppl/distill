

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Distill</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/recommendation-card.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-cream text-ink antialiased">
 
  <div class="flex min-h-screen">
    <div id="sidebar-root"></div>
 
    <div class="flex-1 min-w-0 flex flex-col">
      <header class="h-20 shrink-0 flex items-center px-6 lg:px-10 border-b border-line bg-cream/80 backdrop-blur sticky top-0 z-20">
        <div id="topnav-root" class="w-full"></div>
      </header>
 
      <main class="flex-1 px-6 py-10 page-enter">
        <div class="max-w-2xl mx-auto text-center pt-16">

          <h1 class="text-3xl font-bold tracking-tight">What are you trying to get done?</h1>
          <p class="mt-3 text-muted">Describe a task and Distill will match you with the best AI tools for it.</p>

          <!-- Search & Multi-Query Controls -->
          <div class="flex items-center gap-3 mt-8">
            <div class="flex-1 search-shell flex items-center gap-3 bg-white rounded-search shadow-search border border-line h-[56px] px-4">
              <i data-lucide="search" class="w-5 h-5 text-gray-400 shrink-0"></i>
              <input id="homeSearchInput" type="text" autocomplete="off" placeholder="Search AI tools for any task..."
                class="flex-1 min-w-0 bg-transparent outline-none text-sm placeholder:text-gray-400" />
              <button id="voiceSearchBtn"
                class="btn-scale shrink-0 w-10 h-10 rounded-full flex items-center justify-center text-gray-500 hover:bg-green-light hover:text-green-dark transition"
                title="Search by voice">
                <i data-lucide="mic" class="w-5 h-5"></i>
              </button>
              <button id="homeSearchBtn" class="btn-scale shrink-0 px-5 py-2 rounded-btn bg-green text-white text-sm font-semibold hover:bg-green-dark">Search</button>
            </div>
            <button id="addQueryBtn" class="btn-scale shrink-0 w-11 h-11 rounded-full bg-green-light text-green-dark flex items-center justify-center hover:bg-green hover:text-white transition-colors" title="Add additional keywords">
              <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
          </div>

          <!-- Active Tags (queued keywords before "Search" is pressed) -->
          <div id="activeTags" class="flex flex-wrap gap-2 justify-center mt-4"></div>

        </div>
      </main>

      <div id="footer-root"></div>
    </div>
  </div>

  <!--
    Recommendation cards no longer render on this page — they live on their
    own page now (recommendations.html) so Home stays a lightweight search
    entry point instead of a long, card-heavy scroll. See
    js/recommendation-card.js / css/recommendation-card.css for that page.
  -->

  <script src="js/auth.js"></script>
  <script src="js/history.js"></script>
  <script src="js/components.js"></script>
  <script src="js/search.js"></script>
  <script>
    requireAuth();
    renderShell("home");

    // Home only collects the query — actually finding & showing matches
    // happens on recommendations.html, which renderRecommendationCards()
    // populates.
    let activeQueries = [];

    const searchInput = document.getElementById('homeSearchInput');
    const searchBtn = document.getElementById('homeSearchBtn');
    const voiceSearchBtn = document.getElementById('voiceSearchBtn');
    const addBtn = document.getElementById('addQueryBtn');
    const activeTags = document.getElementById('activeTags');

    // Voice Search
    const SpeechRecognition =
      window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();

      recognition.lang = "en-IN";
      recognition.continuous = false;
      recognition.interimResults = false;

      voiceSearchBtn.addEventListener("click", () => {
        recognition.start();

        voiceSearchBtn.classList.add("bg-red-100", "text-red-500");
        voiceSearchBtn.innerHTML =
          '<i data-lucide="mic-off" class="w-5 h-5"></i>';

        if (window.lucide) lucide.createIcons();
      });

      recognition.onresult = (event) => {
        const voiceText = event.results[0][0].transcript;
        searchInput.value = voiceText;
        searchBtn.click();
      };

      recognition.onend = () => {
        voiceSearchBtn.classList.remove("bg-red-100", "text-red-500");
        voiceSearchBtn.innerHTML =
          '<i data-lucide="mic" class="w-5 h-5"></i>';

        if (window.lucide) lucide.createIcons();
      };

      recognition.onerror = (event) => {
        console.log("Voice recognition error:", event.error);

        voiceSearchBtn.classList.remove("bg-red-100", "text-red-500");
        voiceSearchBtn.innerHTML =
          '<i data-lucide="mic" class="w-5 h-5"></i>';

        if (window.lucide) lucide.createIcons();
      };
    } else {
      voiceSearchBtn.addEventListener("click", () => {
        alert("Voice search is not supported in this browser. Please use Chrome.");
      });
    }

    // If we landed here with ?q= (an old link/bookmark, sidebar recent
    // search, dashboard history item, etc.) hand straight off to the
    // results page instead of showing anything on Home.
    const urlParams = new URLSearchParams(window.location.search);
    const initialQuery = urlParams.get('q');
    if (initialQuery) {
      window.location.replace(`recommendations.html?q=${encodeURIComponent(initialQuery)}`);
    }

    function renderTags() {
      activeTags.innerHTML = activeQueries.map((q, i) => `
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-green-light text-green-dark text-xs font-semibold">
          ${q}
          <button class="remove-tag hover:text-red-500" data-index="${i}"><i data-lucide="x" class="w-3 h-3"></i></button>
        </span>
      `).join('');
      if (window.lucide) lucide.createIcons();

      document.querySelectorAll('.remove-tag').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.index);
          activeQueries.splice(idx, 1);
          renderTags();
        });
      });
    }

    function goToRecommendations() {
      if (!activeQueries.length) return;
      const fullQuery = activeQueries.join(" ");
      addHistory(fullQuery);
      window.location.href = `recommendations.html?q=${encodeURIComponent(fullQuery)}`;
    }

    // Event Listeners
    searchBtn.addEventListener('click', () => {
      const val = searchInput.value.trim();
      if (!val) return;
      activeQueries = activeQueries.length ? [...activeQueries, val] : [val];
      goToRecommendations();
    });

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') searchBtn.click();
    });

    // "+" queues an extra keyword as a tag without leaving the page yet —
    // useful for building a compound query before handing off to Search.
    addBtn.addEventListener('click', () => {
      const val = searchInput.value.trim();
      if (!val) return;
      activeQueries.push(val);
      renderTags();
      searchInput.value = '';
    });

    renderTags();
  </script>
</body>
</html>
