<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trendy · Distill</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-cream text-ink antialiased">

  <div class="flex min-h-screen">
    <div id="sidebar-root"></div>

    <div class="flex-1 min-w-0 flex flex-col">
      <header class="h-20 shrink-0 flex items-center px-6 lg:px-10 border-b border-line bg-cream/80 backdrop-blur sticky top-0 z-20">
        <div id="topnav-root" class="w-full"></div>
      </header>

      <main class="flex-1 px-6 lg:px-10 py-10 page-enter">
        <div class="max-w-5xl mx-auto">
          <div class="flex items-center gap-3 mb-1">
            <span class="w-9 h-9 rounded-xl bg-green-light flex items-center justify-center">
              <i data-lucide="flame" class="w-5 h-5 text-green-dark"></i>
            </span>
            <h1 class="text-2xl font-bold">Trending AI tools</h1>
          </div>
          <p class="text-muted mb-8">What professionals and students are reaching for most this week.</p>

          <div id="trendyGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5 stagger"></div>
        </div>
      </main>

      <div id="footer-root"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/history.js"></script>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/tools-grid.js"></script>
  <script>
  requireAuth();
  renderShell("trendy");
const TRENDING_CACHE_KEY = "distill_trending_cache";

async function loadTrending() {

  /* =========================================================
     LOAD PREVIOUS TRENDING DATA FIRST
     ========================================================= */

  try {

    const cached =
      sessionStorage.getItem(
        TRENDING_CACHE_KEY
      );

    if (cached) {

      const cachedTools =
        JSON.parse(cached);

      if (
        Array.isArray(cachedTools) &&
        cachedTools.length > 0
      ) {

        console.log(
          "🔥 Loaded trending tools from session cache"
        );

        renderTrendingGrid(
          "trendyGrid",
          cachedTools
        );
      }
    }

  } catch (error) {

    console.warn(
      "Trending cache read failed:",
      error
    );
  }


  /* =========================================================
     FETCH FRESH DATA
     ========================================================= */

  try {

    const response =
      await fetch(
        "http://localhost:5000/api/trending"
      );

    const data =
      await response.json();

    if (!data.success) {

      console.error(
        "Failed to load trending tools"
      );

      return;
    }


    console.log(
      "🔥 Fresh Product Hunt trending data:",
      data.tools
    );


    /* ---------------------------------------------------------
       Save latest data
       --------------------------------------------------------- */

    sessionStorage.setItem(
      TRENDING_CACHE_KEY,
      JSON.stringify(data.tools)
    );


    /* ---------------------------------------------------------
       Update grid
       --------------------------------------------------------- */

    renderTrendingGrid(
      "trendyGrid",
      data.tools
    );


  } catch (error) {

    console.error(
      "❌ Trending API error:",
      error
    );
  }
}


loadTrending();
  </script>
</body>
</html>
