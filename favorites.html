<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Favorites · Distill</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/recommendation-card.css" />
<link rel="stylesheet" href="css/favorites.css" />
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-cream text-ink antialiased">

  <div class="flex min-h-screen">
    <div id="sidebar-root"></div>

    <div class="flex-1 min-w-0 flex flex-col">
      <header class="h-20 shrink-0 flex items-center px-6 lg:px-10 border-b border-line bg-cream/80 backdrop-blur sticky top-0 z-20">
        <div id="topnav-root" class="w-full"></div>
      </header>

      <main class="flex-1 px-6 lg:px-10 py-10 page-enter">
        <div class="max-w-5xl mx-auto">
          <div class="flex items-center gap-3 mb-1">
            <span class="w-9 h-9 rounded-xl bg-green-light flex items-center justify-center">
              <i data-lucide="star" class="w-5 h-5 text-green-dark"></i>
            </span>
            <h1 class="text-2xl font-bold">Favorites</h1>
          </div>
          <p class="text-muted mb-8">Tools you've starred, all in one place.</p>

          <div id="favoritesLoading" class="text-center py-20 text-muted text-sm">
            Loading your favorites…
          </div>

          <div id="favoritesEmpty" class="distill-fav-empty hidden">
            <div class="distill-fav-empty-icon">⭐</div>
            <p>No favorites yet.<br />Click the star on any card to save it here.</p>
          </div>

          <div id="favoritesGrid"></div>
        </div>
      </main>

      <div id="footer-root"></div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/history.js"></script>
  <script src="js/components.js"></script>
  <script src="js/rating.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/recommendation-card.js"></script>

  <script>
    requireAuth();
    renderShell("favorites");

    const loadingEl = document.getElementById("favoritesLoading");
    const emptyEl = document.getElementById("favoritesEmpty");
    const gridEl = document.getElementById("favoritesGrid");

    function favoriteToToolObject(favorite) {
      const snapshot = favorite.item_data || {};
      return {
        ...snapshot,
        id: snapshot.id ?? favorite.item_id,
      };
    }

    async function loadFavorites() {
      loadingEl.classList.remove("hidden");
      emptyEl.classList.add("hidden");
      gridEl.innerHTML = "";

      let favorites = [];
      try {
        favorites = await getMyFavoritesApi();
      } catch (error) {
        console.error("Failed to load favorites:", error);
      }

      loadingEl.classList.add("hidden");

      const toolFavorites = favorites
        .filter((f) => f.item_type === "tool")
        .map(favoriteToToolObject);

      if (!toolFavorites.length) {
        emptyEl.classList.remove("hidden");
        return;
      }

      renderRecommendationCards(gridEl, toolFavorites);
    }

    document.addEventListener("distill:favorites-changed", () => {
      loadFavorites();
    });

    loadFavorites();
  </script>
</body>
</html>
